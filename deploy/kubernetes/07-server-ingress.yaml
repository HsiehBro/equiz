apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exam-server-ingress
  namespace: exam-prep
  labels:
    app.kubernetes.io/name: exam-server
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # 支持大文件上传（如导入包含大量考题的 Excel/CSV 文件）
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # 若配置了 cert-manager 自动颁发 Let's Encrypt 证书，可解开下行注释:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: api.exam.example.com  # 替换为已在微信开放平台配置的合法业务域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exam-server-service
                port:
                  number: 8080
  # TLS/HTTPS 配置：微信小程序生产环境强制要求 HTTPS
  tls:
    - hosts:
        - api.exam.example.com
      secretName: exam-server-tls  # 包含 tls.crt 与 tls.key 的 Secret
