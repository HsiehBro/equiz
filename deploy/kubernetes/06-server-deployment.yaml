apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-server
  namespace: exam-prep
  labels:
    app.kubernetes.io/name: exam-server
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: exam-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exam-server
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: exam-server
          image: exam-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: exam-server-config
            - secretRef:
                name: exam-server-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: exam-server-service
  namespace: exam-prep
  labels:
    app.kubernetes.io/name: exam-server
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  # 若在无 Ingress 的测试环境下需要通过节点端口直接访问，可将 type 改为 NodePort:
  # type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      # nodePort: 30080
  selector:
    app.kubernetes.io/name: exam-server
